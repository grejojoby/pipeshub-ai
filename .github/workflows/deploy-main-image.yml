name: Deploy main image

# Push to main builds this repo's Dockerfile on the server and recreates
# pipeshub-ai from that image. The server must not keep running
# pipeshubai/pipeshub-ai:latest with files copied in after the fact: a
# recreate throws those copies away.
#
# Required repository secrets:
#   DEPLOY_SSH_KEY   private key authorized on the server
#   DEPLOY_HOST      server address
#   DEPLOY_USER      ssh user (root)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'grejojoby/pipeshub-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout deploy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deployment/deploy-main-image.sh
          sparse-checkout-cone-mode: false

      - name: Build this commit on the server and switch to it
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY}" ] || [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ]; then
            echo "::error::Set DEPLOY_SSH_KEY, DEPLOY_HOST, and DEPLOY_USER on this repository."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -t ed25519 "$SSH_HOST" > ~/.ssh/known_hosts
          grep -q 'AAAAC3NzaC1lZDI1NTE5AAAAIJoZVl++Y44bif85TEHVUeS6tM1tJltVurddrfujBf/6' ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=240 \
            "${SSH_USER}@${SSH_HOST}" "bash -s -- ${SHA}" \
            < deployment/deploy-main-image.sh
